<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profit & Price Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.553.0"
  }
}
</script>
</head>
<body class="bg-gray-100 dark:bg-gray-900">
    <div class="min-h-screen text-gray-800 dark:text-gray-200 flex items-center justify-center p-4 transition-colors duration-300">
      <main class="w-full max-w-md mx-auto">
        <header class="text-center mb-8">
          <div class="inline-flex items-center justify-center bg-indigo-100 dark:bg-indigo-900/50 rounded-full p-3 mb-4">
             <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-600 dark:text-indigo-400"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><line x1="16" x2="12" y1="14" y2="14"/><line x1="12" x2="12" y1="14" y2="18"/><line x1="8" x2="8" y1="14" y2="18"/></svg>
          </div>
          <h1 class="text-3xl md:text-4xl font-bold text-gray-900 dark:text-white">
            Profit & Price Calculator
          </h1>
          <p class="mt-2 text-md text-gray-600 dark:text-gray-400 max-w-xl mx-auto">
            Convert USD purchase price to L.L sale price with desired profit margin.
          </p>
        </header>

        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 md:p-8 space-y-8">
          <div class="flex flex-col gap-6">
            <!-- Purchase Price Input -->
            <div class="flex flex-col space-y-2">
              <label for="purchase-price" class="text-sm font-medium text-gray-700 dark:text-gray-300">
                Purchase Price
              </label>
              <div class="relative rounded-md shadow-sm">
                <input type="number" name="purchase-price" id="purchase-price" class="block w-full rounded-lg border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 pr-12 pl-4 py-3 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors duration-200" placeholder="e.g., 10" min="0" step="any">
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
                  <span class="text-gray-500 dark:text-gray-400 sm:text-sm">$</span>
                </div>
              </div>
            </div>
            <!-- Profit Percentage Input -->
            <div class="flex flex-col space-y-2">
              <label for="profit-percentage" class="text-sm font-medium text-gray-700 dark:text-gray-300">
                Profit Percentage
              </label>
              <div class="relative rounded-md shadow-sm">
                <input type="number" name="profit-percentage" id="profit-percentage" class="block w-full rounded-lg border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 pr-12 pl-4 py-3 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors duration-200" placeholder="e.g., 20" min="0" step="any">
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
                  <span class="text-gray-500 dark:text-gray-400 sm:text-sm">%</span>
                </div>
              </div>
            </div>
            <!-- Quantity Input -->
            <div class="flex flex-col space-y-2">
              <label for="quantity" class="text-sm font-medium text-gray-700 dark:text-gray-300">
                Quantity
              </label>
              <div class="relative rounded-md shadow-sm">
                <input type="number" name="quantity" id="quantity" value="1" class="block w-full rounded-lg border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 pr-12 pl-4 py-3 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors duration-200" placeholder="e.g., 5" min="1" step="1">
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
                  <span class="text-gray-500 dark:text-gray-400 sm:text-sm">pcs</span>
                </div>
              </div>
            </div>
          </div>

          <div class="border-t border-gray-200 dark:border-gray-700"></div>

          <div>
            <h2 class="text-lg font-semibold text-center mb-4 text-gray-600 dark:text-gray-300">
              Calculation Result
            </h2>
            <div class="grid grid-cols-1">
               <div class="bg-gray-100 dark:bg-gray-700/50 rounded-lg p-4 text-center transform transition-transform duration-300 hover:scale-105">
                  <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Total Sale Price</p>
                  <p id="total-sale-price-value" class="mt-1 text-2xl md:text-3xl font-bold text-indigo-600 dark:text-indigo-400 tracking-tight">0</p>
                  <p class="text-xs font-semibold text-gray-600 dark:text-gray-300 uppercase mt-1">L.L</p>
                </div>
            </div>
          </div>
           <div class="flex justify-end pt-4">
              <button id="reset-button" class="flex items-center gap-2 px-4 py-2 bg-red-500 text-white font-semibold rounded-lg shadow-md hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-opacity-75 transition-all duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v6h6"/><path d="M21 12A9 9 0 0 0 6 5.3L3 8"/><path d="M21 22v-6h-6"/><path d="M3 12a9 9 0 0 0 15 6.7l3-2.7"/></svg>
                Reset
              </button>
            </div>
        </div>
        <footer class="text-center mt-8 text-sm text-gray-500 dark:text-gray-400">
          <p>Exchange Rate: 1 USD = 90,000 L.L</p>
          <p>&copy; <span id="year"></span> Profit & Price Calculator. All rights reserved.</p>
        </footer>
      </main>
    </div>

    <script>
      const purchasePriceInput = document.getElementById('purchase-price');
      const profitPercentageInput = document.getElementById('profit-percentage');
      const quantityInput = document.getElementById('quantity');
      const totalSalePriceValue = document.getElementById('total-sale-price-value');
      const resetButton = document.getElementById('reset-button');
      const yearSpan = document.getElementById('year');

      const USD_TO_LL_RATE = 90000;

      function calculateAndDisplay() {
        const pp = parseFloat(purchasePriceInput.value) || 0;
        const profit = parseFloat(profitPercentageInput.value) || 0;
        const qty = parseInt(quantityInput.value) || 0;

        let totalSaleLL = 0;
        if (pp > 0 && qty > 0) {
          const profitAmountUSD = pp * (profit / 100);
          const salePriceUSD = pp + profitAmountUSD;
          const salePriceLL = salePriceUSD * USD_TO_LL_RATE;
          totalSaleLL = salePriceLL / qty;
        }
        
        totalSalePriceValue.textContent = totalSaleLL.toLocaleString('en-US', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0,
        });
      }

      function handleReset() {
        purchasePriceInput.value = '';
        profitPercentageInput.value = '';
        quantityInput.value = '1';
        calculateAndDisplay();
      }

      // Add event listeners
      purchasePriceInput.addEventListener('input', calculateAndDisplay);
      profitPercentageInput.addEventListener('input', calculateAndDisplay);
      quantityInput.addEventListener('input', calculateAndDisplay);
      resetButton.addEventListener('click', handleReset);

      // Set footer year and initial calculation
      yearSpan.textContent = new Date().getFullYear();
      calculateAndDisplay();
    </script>
</body>
</html>
